<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Wallet</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header span {
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .users-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .users-section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .balance {
            font-weight: bold;
            color: #16a34a;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .container {
                margin: 20px auto;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 9px;
            }
        }

    </style>
</head>

<body>

<header class="header">

    <h1>💳 Payment Wallet</h1>

    <span>Wallet Management System</span>

</header>


<div class="container">

    <div class="dashboard">


        <!-- Add User -->

        <div class="card">

            <h2>👤 Add User</h2>

            <form action="/add-user" method="post">

                <div class="form-group">

                    <label for="name">
                        User Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter user name"
                            required>

                </div>

                <button type="submit">
                    + Add User
                </button>

            </form>

        </div>


        <!-- Credit Money -->

        <div class="card">

            <h2>💰 Credit Amount</h2>

            <form action="/credit" method="post">

                <div class="form-group">

                    <label for="userId">
                        Select User
                    </label>

                    <select id="userId"
                            name="userId"
                            required>

                        <option value="">
                            Select User
                        </option>

                        <option
                                th:each="user : ${users}"
                                th:value="${user.id}"
                                th:text="${user.name}">
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="1"
                            step="0.01"
                            placeholder="Enter amount"
                            required>

                </div>


                <button type="submit">
                    💳 Credit Amount
                </button>

            </form>

        </div>

    </div>


    <!-- All Users -->

    <div class="users-section">

        <h2>👥 All Users</h2>


        <div th:if="${users.empty}"
             class="empty">

            No users available.

            Please add a user first.

        </div>


        <table th:unless="${users.empty}">

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Wallet Balance</th>

                <th>Status</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}">
                    1
                </td>

                <td th:text="${user.name}">
                    Deepak
                </td>

                <td class="balance">

                    ₹<span
                        th:text="${#numbers.formatDecimal(user.balance, 1, 2)}">
                    0.00
                    </span>

                </td>

                <td>
                    Active
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
