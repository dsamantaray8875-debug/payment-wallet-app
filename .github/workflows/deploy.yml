name: Payment Wallet OIDC Debug

on:
  push:
    branches:
      - main

jobs:
  oidc-debug:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get GitHub OIDC Token Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const parts = token.split('.');
            const payload = JSON.parse(
              Buffer.from(parts[1], 'base64url').toString()
            );

            console.log("========== OIDC CLAIMS ==========");
            console.log("Issuer:", payload.iss);
            console.log("Audience:", payload.aud);
            console.log("Subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository Owner:", payload.repository_owner);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository Owner ID:", payload.repository_owner_id);
            console.log("Ref:", payload.ref);
            console.log("Event:", payload.event_name);
            console.log("=================================");
